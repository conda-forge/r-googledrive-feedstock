{% set version = "2.1.2" %}
{% set posix = 'm2-' if win else '' %}

package:
  name: r-googledrive
  version: {{ version|replace("-", "_") }}

source:
  url:
    - {{ cran_mirror }}/src/contrib/googledrive_{{ version }}.tar.gz
    - {{ cran_mirror }}/src/contrib/Archive/googledrive/googledrive_{{ version }}.tar.gz
  sha256: 3809ea4d8333eb80e6ca4e780f198014f65b21c3cf4ec95a63aeb6772c8d94aa

build:
  number: 1
  noarch: generic
  rpaths:
    - lib/R/lib/
    - lib/

requirements:
  build:
    - {{ posix }}zip               # [win]
    - cross-r-base {{ r_base }}    # [build_platform != target_platform]
  host:
    - r-base
    - r-cli >=3.0.0
    - r-gargle >=1.6.0
    - r-glue >=1.4.2
    - r-httr
    - r-jsonlite
    - r-lifecycle
    - r-magrittr
    - r-pillar >=1.9.0
    - r-purrr >=1.0.1
    - r-rlang >=1.0.2
    - r-tibble >=2.0.0
    - r-uuid
    - r-vctrs >=0.3.0
    - r-withr
  run:
    - r-base
    - r-cli >=3.0.0
    - r-gargle >=1.6.0
    - r-glue >=1.4.2
    - r-httr
    - r-jsonlite
    - r-lifecycle
    - r-magrittr
    - r-pillar >=1.9.0
    - r-purrr >=1.0.1
    - r-rlang >=1.0.2
    - r-tibble >=2.0.0
    - r-uuid
    - r-vctrs >=0.3.0
    - r-withr

test:
  commands:
    - $R -e "library('googledrive')"           # [not win]
    - "\"%R%\" -e \"library('googledrive')\""  # [win]

about:
  home: https://googledrive.tidyverse.org, https://github.com/tidyverse/googledrive
  license: MIT
  summary: Manage Google Drive files from R.
  license_family: MIT
  license_file:
    - {{ environ["PREFIX"] }}/lib/R/share/licenses/MIT
    - LICENSE

extra:
  recipe-maintainers:
    - conda-forge/r
    - brendanf

